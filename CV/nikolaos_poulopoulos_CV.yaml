    projects:
      - name: '[Decyra](https://github.com/nikwilldoit/Decyra)'
        start_date: 2026-02
        end_date: 2026-06
        location:
        summary: DECYRA is an AI-powered Android app for Computer Science students, offering personalized academic and career guidance through a RAG-based mentor. It also includes real-time messaging, a forum, Face ID authentication, and WebRTC video conferencing, built on Firebase, AWS, and Supabase.
        
      - name: '[Raki SaaS System](https://github.com/nikwilldoit/Raki_SaaS_System)'
        start_date: 2025-09
        end_date: 2026-01
        location:
        summary: Raki is a full-stack SaaS POS web application developed with a Spring Boot backend and a React frontend, designed to support small businesses with menu management, orders, payments, reservations, staff administration, taxation, and business operations. The backend provides REST APIs, JWT-based authentication, role-based security, and modular business logic, while the frontend delivers a responsive and interactive user experience.
      
      - name: '[Distributed Systems Casino](https://github.com/nikwilldoit/Distributed-Systems-Casino)'
        start_date: 2026-02
        end_date: 2026-06
        location:
        summary: Distributed casino application based on a MapReduce framework, enabling parallel processing and execution across multiple PCs.
      
    skills:
      - label: Backend Development
        details: Spring Boot, Spring Security, REST APIs, JWT authentication, business logic, persistence, database design.
      - label: Frontend Development
        details: React, Thymeleaf, responsive UI development, multi-step workflows, form handling, Fetch API integration.
      - label: Cloud Computing
        details: Firebase, Supabase, AWS, real-time messaging, secure backend services, cloud-based AI integration, scalable architecture.
      - label: Android Development
        details: Kotlin, Jetpack Compose, Java integration, mobile UI design, Android app architecture.
      - label: Parallel Programming
        details: CUDA programming, OpenMP, POSIX Threads.
      - label: Distributed Systems
        details: Client-master-worker architecture, MapReduce, inter-node communication, task scheduling, fault tolerance, active replication, heartbeat
      
    soft-skills:
      - label: Soft Skills
        details: Problem-solving, Interpersonal and Social Skills, Quick Learner, Teamwork, Adaptability, Task Organization, Multitasking.

